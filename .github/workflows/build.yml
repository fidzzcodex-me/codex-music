name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --legacy-peer-deps
          fi

      - name: Verify gradle-plugin exists
        run: |
          echo "== resolved version =="
          npm list @react-native/gradle-plugin || true
          echo "== folder contents =="
          ls -la node_modules/@react-native/gradle-plugin || echo "MISSING gradle-plugin folder"
          echo "== settings.gradle / build.gradle of plugin =="
          cat node_modules/@react-native/gradle-plugin/settings.gradle.kts 2>/dev/null || echo "no settings.gradle.kts"
          find node_modules/@react-native/gradle-plugin -maxdepth 2 -iname "*.gradle*"

      - name: Patch gradle-plugin settings (remove foojay-resolver)
        run: |
          sed -i '/foojay-resolver-convention/d' node_modules/@react-native/gradle-plugin/settings.gradle.kts
          cat node_modules/@react-native/gradle-plugin/settings.gradle.kts

      - name: Debug build gradle-plugin standalone
        run: |
          cd node_modules/@react-native/gradle-plugin
          curl -sSL -o /tmp/gw-standalone.jar https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          cp /tmp/gw-standalone.jar gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradlew || true
          chmod +x gradlew 2>/dev/null || true
          java -jar gradle/wrapper/gradle-wrapper.jar build --stacktrace 2>&1 | tail -80 || true

      - name: Fetch official Gradle 8.6 wrapper jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          ls -la android/gradle/wrapper/gradle-wrapper.jar
          file android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=FidzzMusic Debug,O=Codex,C=ID"

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FidzzMusic-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FidzzMusic Build #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
